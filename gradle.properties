org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# org.gradle.java.home volontairement NON défini ici : ce fichier est suivi par git
# et un chemin en dur (ex. Android Studio macOS) casse le build sur toute autre
# machine et en CI. Gradle utilise JAVA_HOME de l'environnement. Pour fixer un JDK
# spécifique par poste, utiliser ~/.gradle/gradle.properties (non versionné).
